name: Bienvenida

on:
  pull_request:
    types: [opened]

jobs: 
  welcome:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Sorry, something went wrong, try again..."
        pr-message: "PR merged!"
      
  auto-approve:
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ secrets.OP }}